jobName: containerd-tooling-{{ .releaseBranch }}-presubmit-amd64
runIfChanged: build/lib/.*|Common.mk|projects/containerd/containerd/.*
commands:
- if $(make check-project-path-exists); then make build -C $PROJECT_PATH; fi
projectPath: projects/containerd/containerd
runtimeImage: {{ if eq .releaseBranch "1-37" }}public.ecr.aws/eks-distro-build-tooling/builder-base:standard-ce9299c7b5631a8e3d611cfc81831dd52f7dc7b9.2023
envVars:
- name: BINARY_PLATFORMS
  value: linux/amd64
- name: ARTIFACTS_BUCKET
  value: s3://projectbuildpipeline-857-pipelineoutputartifactsb-10ajmk30khe3f
- name: RELEASE_BRANCH
  value: {{ .releaseBranch }}
imageBuild: true
resources:
  requests:
    memory: 16Gi
    cpu: 4
